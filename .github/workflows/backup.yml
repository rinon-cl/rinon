name: Backup a repo privado
on:
  schedule:
    - cron: "0 6 * * 1"  # lunes 03:00 Chile
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Copia a enrique636/rinon-backup
        env:
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          git clone --bare https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git src
          cd src
          git push --prune https://x-access-token:$TOKEN@github.com/enrique636/rinon-backup.git '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
